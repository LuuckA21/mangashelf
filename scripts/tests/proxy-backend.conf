# Echo only synthetic request headers in the isolated proxy regression test.
server {
    listen 8080;
    location = /api/upstream-rate-limit {
        default_type application/json;
        add_header Retry-After 42 always;
        return 429 '{"error":"upstream_rate_limited"}';
    }
    location / {
        default_type text/plain;
        return 200 "$http_x_forwarded_for|$http_x_real_ip|$http_x_forwarded_proto|$http_x_forwarded_host|$http_forwarded";
    }
}
