name: Release

# Builds the Docker image of a new version into a DRAFT release, to be checked
# and published by hand. Publishing it (as Latest) deploys it (deploy.yml).
#
# Normal flow: a PR bumps <version> in backend/pom.xml (and adds the
# CHANGELOG.md section); when it lands on main this workflow sees a version
# with no published release, builds and pushes ghcr.io/<repo>:vX.Y.Z, creates
# the vX.Y.Z tag on that commit and a draft release with the CHANGELOG section
# as notes. Pushes to main that keep the version do nothing, and neither do
# -SNAPSHOT versions.
#
# Also possible: run it by hand on main (Actions -> Release) for a version
# with no published release. There is no tag trigger: a tag can point at any
# commit, and a tag-triggered run would use that commit's (unreviewed) copy of
# this file. If a run fails, re-run it: it reuses the tag and the draft the
# failed run may have created.
on:
  push:
    branches: [main]
    paths: [backend/pom.xml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tag + draft release
      packages: write # push the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are built from main only (this run is on $GITHUB_REF)."
            exit 1
          fi
          # Nothing to release: fine on push (the version didn't change), an error when run by hand.
          nothing() {
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "$1, nothing to do"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$1. Bump <version> in backend/pom.xml first."
            exit 1
          }
          # Direct <version> child of <project>, not the Spring Boot <parent> version
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("backend/pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version") or "")')
          if [[ "$version" == *-SNAPSHOT ]]; then nothing "$version is a development version"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=backend/pom.xml::Version '$version' is not X.Y.Z."
            exit 1
          fi
          tag="v$version"

          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\"")
          if grep -q ' false$' <<< "$releases"; then nothing "$tag is already published"; fi
          drafts=$(grep -c ' true$' <<< "$releases" || true)
          if [ "$drafts" -gt 1 ]; then
            echo "::error::$drafts draft releases exist for $tag; delete the extra drafts first."
            exit 1
          fi
          draft_id=$(awk '$2 == "true" { print $1 }' <<< "$releases")

          # A tag left by a failed run is reused only if it is on this very commit.
          tag_exists=false
          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2> /dev/null); then
            read -r type sha <<< "$ref"
            if [ "$type" = tag ]; then sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha); fi
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already exists on $sha, not on $GITHUB_SHA. Delete that tag and its draft, or bump the version."
              exit 1
            fi
            tag_exists=true
          fi

          {
            echo "release=true"
            echo "tag=$tag"
            echo "draft_id=$draft_id"
            echo "tag_exists=$tag_exists"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract the release notes
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version=${TAG#v}
          section=$(awk -v head="## [$version]" '
            /^## \[/ { if (found) exit; found = index($0, head) == 1; next }
            found' CHANGELOG.md)
          if [ -z "${section//[[:space:]]/}" ]; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section with release notes."
            exit 1
          fi
          printf '%s\n' "$section" > "$RUNNER_TEMP/notes.md"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.version.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built before tagging: if the build fails, no tag or draft is left behind.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.version.outputs.release == 'true'
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image }}:${{ github.sha }}

      - name: Create the tag
        if: steps.version.outputs.release == 'true' && steps.version.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="$TAG" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" > /dev/null
          echo "Created $TAG on $GITHUB_SHA"

      - name: Create or update the draft release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT_ID: ${{ steps.version.outputs.draft_id }}
        run: |
          if [ -n "$DRAFT_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" -F body=@"$RUNNER_TEMP/notes.md" > /dev/null
            echo "Updated draft release $DRAFT_ID"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="$TAG" \
              -F body=@"$RUNNER_TEMP/notes.md" -F draft=true -F prerelease=false --jq .id)
            echo "Created draft release $id"
          fi
          echo "Draft ready: check it under Releases and publish it as Latest to deploy." >> "$GITHUB_STEP_SUMMARY"
