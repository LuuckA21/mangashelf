name: build

# Builds backend and frontend on every push. Catches the errors that would
# otherwise only surface during the Docker build on the server, where they
# cost minutes instead of seconds.

on:
  push:
    branches: [master]
  pull_request:

# The build only reads the repository. Keep the automatic token from gaining
# write access if the repository defaults are relaxed in the future.
permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >-
          bash -n deploy.sh
          scripts/backup.sh
          scripts/backup-scheduled.sh
          scripts/restore.sh
          scripts/test-backup-restore.sh
          scripts/test-deploy.sh
          scripts/test-scheduled-backup.sh
          scripts/tests/fake-docker
      - run: systemd-analyze verify ops/systemd/mangashelf-backup.service ops/systemd/mangashelf-backup.timer
      - run: ./scripts/test-backup-restore.sh
      - run: ./scripts/test-deploy.sh
      - run: ./scripts/test-scheduled-backup.sh
      - run: python3 scripts/test-proxy-headers.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # Runs the integration tests too: the GitHub runners have Docker, which
      # is all Testcontainers needs to bring up a real Postgres.
      - run: mvn -B -f backend/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, db]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build application image or pull database image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [ "$COMPONENT" = db ]; then
            image=$(awk '$1 == "image:" && $2 ~ /^postgres:/ { print $2 }' docker-compose.yml)
            docker pull "$image"
            docker tag "$image" "mangashelf-$COMPONENT:ci"
          else
            docker build -t "mangashelf-$COMPONENT:ci" "./$COMPONENT"
          fi
      - name: Scan runtime OS and application dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mangashelf-${{ matrix.component }}:ci
          version: v0.74.0
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          timeout: 10m
