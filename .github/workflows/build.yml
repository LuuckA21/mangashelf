name: build

# Builds backend and frontend on every push. Catches the errors that would
# otherwise only surface during the Docker build on the server, where they
# cost minutes instead of seconds.

on:
  push:
    branches: [master]
  pull_request:

# The build only reads the repository. Keep the automatic token from gaining
# write access if the repository defaults are relaxed in the future.
permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shell syntax
        run: |
          for script in ./*.sh scripts/*.sh scripts/tests/fake-docker; do
            bash -n "$script"
          done
      - run: bash scripts/test-systemd-backup.sh
      - run: ./scripts/test-backup-restore.sh
      - run: ./scripts/test-deploy.sh
      - run: python3 scripts/test-kutt-backups.py
      - run: python3 scripts/test-proxy-headers.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # Runs the integration tests too: the GitHub runners have Docker, which
      # is all Testcontainers needs to bring up a real Postgres.
      - run: mvn -B -f backend/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, db]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build runtime image
        env:
          COMPONENT: ${{ matrix.component }}
        run: docker build -t "mangashelf-$COMPONENT:ci" "./$COMPONENT"
      - name: Verify database startup and existing data
        if: matrix.component == 'db'
        run: python3 scripts/test-database-image.py mangashelf-db:ci
      - name: Scan runtime OS and application dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mangashelf-${{ matrix.component }}:ci
          version: v0.74.0
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          timeout: 10m
