name: build

# Builds backend and frontend on every push. Catches the errors that would
# otherwise only surface during the Docker build on the server, where they
# cost minutes instead of seconds.

on:
  push:
    branches: [master]
  pull_request:

# The build only reads the repository. Keep the automatic token from gaining
# write access if the repository defaults are relaxed in the future.
permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          bash -n deploy.sh
          scripts/backup.sh
          scripts/backup-scheduled.sh
          scripts/restore.sh
          scripts/test-backup-restore.sh
          scripts/test-deploy.sh
          scripts/test-scheduled-backup.sh
          scripts/tests/fake-docker
      - run: systemd-analyze verify ops/systemd/mangashelf-backup.service ops/systemd/mangashelf-backup.timer
      - run: ./scripts/test-backup-restore.sh
      - run: ./scripts/test-deploy.sh
      - run: ./scripts/test-scheduled-backup.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # Runs the integration tests too: the GitHub runners have Docker, which
      # is all Testcontainers needs to bring up a real Postgres.
      - run: mvn -B -f backend/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
