spring:
  application:
    name: mangashelf

  datasource:
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Lo schema lo gestisce Flyway: Hibernate deve solo validare.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: native   # dietro Nginx Proxy Manager
  servlet:
    session:
      timeout: 30d
      cookie:
        name: MANGASESSION
        http-only: true
        secure: ${APP_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  registration-enabled: ${APP_REGISTRATION_ENABLED:true}
  covers-dir: /app/data/covers
  metadata:
    anilist-url: https://graphql.anilist.co
    # AniList consente 90 richieste al minuto e applica anche un
    # limitatore di burst. Restiamo sotto il tetto per lasciare margine:
    # superarlo costa un minuto di timeout su tutte le chiamate.
    anilist-requests-per-minute: 60

logging:
  level:
    me.luucka.mangashelf: INFO
