spring:
  application:
    name: mangashelf

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:true}
      "[mail.smtp.ssl.enable]": ${SMTP_SSL:false}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  data:
    web:
      pageable:
        # Prevent an authenticated caller from turning `size` into an
        # unbounded database query and response allocation.
        max-page-size: 100

  datasource:
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      # Covers are a few hundred kilobytes; the 1 MB default would reject a
      # decent scan, while a larger ceiling would let anything through.
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  forward-headers-strategy: native   # dietro Nginx Proxy Manager
  servlet:
    session:
      timeout: 30d
      cookie:
        name: MANGASESSION
        http-only: true
        secure: ${APP_COOKIE_SECURE:true}
        same-site: lax
        # Without max-age the browser treats this as a session cookie and
        # drops it on close, forcing a fresh login every time — tiresome on
        # a phone especially. It complements the server-side timeout, which
        # alone is not enough.
        max-age: 30d

management:
  health:
    mail:
      # SMTP is optional; a provider outage must not take the catalogue offline
      # or make container probes open SMTP connections on every health check.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    base-url: ${APP_PUBLIC_URL:}
    from: ${MAIL_FROM:}
  # Closed by default: opening registration is an explicit bootstrap/admin
  # decision, never something a missing environment variable should do.
  registration-enabled: ${APP_REGISTRATION_ENABLED:false}
  covers-dir: /app/data/covers
  covers:
    # Remote downloads are restricted to AniList's image CDN. Other sources
    # must be uploaded, avoiding arbitrary server-side requests.
    allowed-hosts: ${APP_COVERS_ALLOWED_HOSTS:s4.anilist.co}
  security:
    registration-attempts-per-hour: 5
  metadata:
    anilist-url: https://graphql.anilist.co
    # Local ceiling per instance. Upstream may enforce a lower limit:
    # HTTP/GraphQL errors trigger a shared cooldown and expose Retry-After.
    anilist-requests-per-minute: 60

logging:
  level:
    me.luucka.mangashelf: INFO
