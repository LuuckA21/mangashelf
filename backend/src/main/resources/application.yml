spring:
  application:
    name: mangashelf

  datasource:
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: native   # dietro Nginx Proxy Manager
  servlet:
    session:
      timeout: 30d
      cookie:
        name: MANGASESSION
        http-only: true
        secure: ${APP_COOKIE_SECURE:true}
        same-site: lax
        # Without max-age the browser treats this as a session cookie and
        # drops it on close, forcing a fresh login every time — tiresome on
        # a phone especially. It complements the server-side timeout, which
        # alone is not enough.
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  registration-enabled: ${APP_REGISTRATION_ENABLED:true}
  covers-dir: /app/data/covers
  metadata:
    anilist-url: https://graphql.anilist.co
    # AniList allows 90 requests a minute and also enforces a burst limiter.
    # Staying under the ceiling leaves headroom: crossing it costs a minute
    # of timeout on every call.
    anilist-requests-per-minute: 60

logging:
  level:
    me.luucka.mangashelf: INFO
