<!doctype html>
<html lang="{{language}}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{subject}} · MangaShelf</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f1efe8;color:#142942;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;">
    <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{preheader}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1efe8;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <!--[if mso]><table role="presentation" width="560"><tr><td><![endif]-->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
            <tr>
              <td style="padding:0 0 24px;color:#1e3a5f;font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:bold;letter-spacing:-1px;">MangaShelf<span style="color:#c93427;">.</span></td>
            </tr>
            <tr>
              <td style="background-color:#fbfaf7;border:1px solid #d6d2c8;border-top:4px solid #1e3a5f;padding:32px 24px;">
                <p style="margin:0 0 18px;color:#706b63;font-size:11px;line-height:16px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;">{{eyebrow}}</p>
                <h1 style="margin:0 0 20px;color:#142942;font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:36px;font-weight:normal;">{{subject}}</h1>
                <p style="margin:0 0 28px;color:#142942;font-size:16px;line-height:26px;">{{instructions}}</p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr><td align="center" bgcolor="#c93427" style="background-color:#c93427;border-radius:3px;mso-padding-alt:14px 24px;">
                    <a href="{{link}}" style="display:inline-block;border:1px solid #c93427;border-radius:3px;padding:14px 24px;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;font-weight:bold;text-align:center;text-decoration:none;">{{button}}</a>
                  </td></tr>
                </table>
                <p style="margin:18px 0 28px;color:#706b63;font-size:13px;line-height:21px;">{{expiry}}</p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #d6d2c8;table-layout:fixed;">
                  <tr><td style="padding-top:24px;">
                    <p style="margin:0 0 8px;color:#706b63;font-size:12px;line-height:20px;">{{fallback}}</p>
                    <p style="margin:0;font-size:12px;line-height:20px;word-break:break-all;overflow-wrap:anywhere;"><a href="{{link}}" style="color:#1e3a5f;text-decoration:underline;word-break:break-all;">{{link}}</a></p>
                  </td></tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 4px 0;color:#706b63;font-size:12px;line-height:20px;">
                <p style="margin:0 0 8px;">{{footer}}</p>
                <p style="margin:0;">MangaShelf · {{tagline}}</p>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
