services:
  db:
    image: postgres:18-alpine
    container_name: mangashelf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18+ wants a single mount at /var/lib/postgresql, not at
      # /var/lib/postgresql/data: the image places data in a per-major-version
      # subdirectory so that a future "pg_upgrade --link" never has to cross a
      # mount boundary.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: mangashelf-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_REGISTRATION_ENABLED: ${APP_REGISTRATION_ENABLED:-true}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      TZ: Europe/Rome
    volumes:
      - covers:/app/data/covers
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    container_name: mangashelf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # IP (or CIDR) of the host running Nginx Proxy Manager. nginx trusts
      # the X-Forwarded-* headers only when they arrive from here.
      MS_TRUSTED_PROXY: ${TRUSTED_PROXY}
      NGINX_ENVSUBST_FILTER: "MS_"
    ports:
      # NPM runs on another machine on the LAN, so the port has to be
      # published. BIND_ADDRESS is this server's LAN IP, never 0.0.0.0.
      - "${BIND_ADDRESS}:${HTTP_PORT:-8080}:80"
    networks:
      - internal

volumes:
  db-data:
  covers:

networks:
  internal:
    driver: bridge
